<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-user="{{ username or '' }}">
    <div class="calc">
        <h2>Calculadora</h2>
        {% if username %}
        <p>Logado como {{ username }} - <a href="/logout">Sair</a></p>
        {% else %}
        <p><a href="/login">Entrar</a> ou <a href="/register">Cadastrar</a></p>
        {% endif %}
        <input id="expressao" type="text" placeholder="Ex: 10 * 2" />
        <button id="btnCalcular">Calcular</button>
        <div id="resultado"></div>
        <div id="erro" class="error"></div>
        <div id="info" class="info-message"></div>
        <h3>Histórico</h3>
        <ul id="historico">
        {% for item in historico|reverse %}
            <li>{{ item.data_hora }} - {{ item.operacao }} = {{ item.resultado }}</li>
        {% endfor %}
        </ul>
        <p><a href="/avancado">Modo avançado</a></p>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
